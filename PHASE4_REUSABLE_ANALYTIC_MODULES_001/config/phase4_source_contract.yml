contract_version: "1.4.0"
phase4_package: "PHASE4_REUSABLE_ANALYTIC_MODULES_001"

purpose: >-
  Define the only admissible runtime inputs for the reusable analytical
  modules that reproduce manuscript statistics and figure-source tables.
  Historical notebooks and original workflow archives are provenance records,
  not executable dependencies.

runtime_input:
  package_name: "PHASE3_CURATED_INPUT_LAYER_FINAL_002"
  accepted_forms:
    - "extracted_directory"
    - "zip_archive_extracted_before_analysis"
  zip_filename: "PHASE3_CURATED_INPUT_LAYER_FINAL_002.zip"
  zip_sha256: "6b978341a993b3066aedac62c6334498d508299f7a6187eae366ffca51b72bab"
  root_directory_name: "PHASE3_CURATED_INPUT_LAYER_FINAL_002"
  version_file:
    path: "VERSION"
    sha256: "3f2b3e4a0b30156365e9a2a68f8e229393f50ec4d1ef648eb29933257c8014f6"
    expected_text: "PHASE3_CURATED_INPUT_LAYER_FINAL_002"
  package_manifest:
    path: "package_file_manifest.csv"
    sha256: "193d061ce4a07968e24f34acf1e829494f236ea8334b263502fa5e95d623d76c"
  validation_summary:
    path: "provenance/phase3_validation_summary.json"
    sha256: "cb15ee1f3c76e30475ad776e913ad9c560b4066cdd6cd7db20900882c6f294cb"
    accepted_statuses:
      - "PASS_WITH_DOCUMENTED_GAPS"
      - "PASS"

runtime_policy:
  notebooks_are_runtime_inputs: false
  original_workflow_archives_are_runtime_inputs: false
  manuscript_text_is_a_numeric_data_source: false
  hard_coded_manuscript_results_allowed: false
  absolute_internal_paths_allowed: false
  inputs_outside_phase3_root_allowed: false
  scientific_values_must_be_derived_from_curated_inputs: true
  every_runtime_file_requires_sha256_match: true
  fail_on_unexpected_input_file: true
  fail_on_missing_required_input: true

notebook_policy:
  provenance_only:
    - "provenance/original_workflows/v42_5/METRIC_daily_integrated_ET_over_season_V42.5_multiple_scenarios-(4).ipynb"
    - "provenance/original_workflows/v46c/METRIC_daily_integrated_ET_over_season_V46C_Forensics_Targeted_AcceptedScene_Pixel_Mechanism_AuditCLEAN_inventory_first(6).ipynb"
    - "provenance/original_workflows/v47b1/METRIC_daily_integrated_ET_over_season_V47_B1_RasterExport_RetainedS4_Corn_ET_Peff_IrrigationProxy(7).ipynb"
    - "provenance/original_workflows/v50/METRIC_daily_integrated_ET_over_season_V50_TrackB_Non2011_ETf_Reconstruction_PumpingProxyReadiness(15).ipynb"
    - "provenance/original_workflows/awm_figure_assembly/AWM_figures.ipynb"
  prohibited_actions:
    - "execute_notebook"
    - "import_notebook_as_module"
    - "read_notebook_outputs_as_runtime_data"
    - "extract_hard_coded_values_from_notebook"
  allowed_actions:
    - "retain_checksum_and lineage metadata"
    - "consult manually during provenance audit"

