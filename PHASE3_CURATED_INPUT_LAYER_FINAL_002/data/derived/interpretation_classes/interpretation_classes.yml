version: "PHASE2_FIGURE8_PUBLICATION_FINAL_003"
release_decision:
  v50_included_narrowly: true
  hls_included_as_support_only: true
  v49_known_cold_evidence_included: false
  class_I_candidate_present: true
  completed_class_I_assignment_present: false
  class_I_candidate_is_not_class_I: true
class_definitions:
  - class_id: "I"
    designation: "Proxy-eligible condition"
    condition: "crop-supported; accepted; coherent; explicit accounting; valid frame and scale; acceptable sensitivity"
    supported_use: "proxy under stated assumptions"
  - class_id: "II"
    designation: "Stress-test condition"
    condition: "coherent but stress-year dominated or reference-sensitive"
    supported_use: "stress-test diagnostic"
  - class_id: "III"
    designation: "Crop-support-limited condition"
    condition: "weak or inconsistent concurrent crop support"
    supported_use: "landscape/crop-support diagnostic"
  - class_id: "IV"
    designation: "Non-interpretable condition"
    condition: "required source or diagnostic support unavailable or invalid"
    supported_use: "excluded from the affected unsupported interpretation"
matrix_rows:
  - condition: "2011 active-canopy large-ETrF scenes"
    final_class: "Class II"
    supported_interpretation: "Stress-test diagnostic"
    basis: "Physically coherent and aerodynamically stable, but extreme-year dominated and materially reference-sensitive."
